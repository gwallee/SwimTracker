<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwimTracker</title>
<script>
  // Share links: <site>/token/<token>/ sets up sync on this device. GitHub Pages serves this page
  // for that path; hand the token to the dashboard in the # part (which stays in the browser) and
  // replace this history entry so the token is not kept in the address bar or history.
  (function () {
    var m = location.pathname.match(/^(.*?)\/token\/(.*)$/);
    if (!m) return;
    var raw = m[2];
    try { raw = decodeURIComponent(raw); } catch (e) {}
    // Forgive copy-paste extras: spaces/line breaks, <angle brackets>, quotes, trailing slash or punctuation.
    var token = raw.replace(/\s+/g, '').replace(/^[<"']+/, '').replace(/[\/>"'.,;:!)]+$/, '');
    if (/^[A-Za-z0-9_]{20,255}$/.test(token)) { location.replace(m[1] + '/#token=' + token); return; }
    window.__tokenProblem = token.length === 0 ? 'The link has nothing after /token/.'
      : /^token$/i.test(token) ? 'The link still has the placeholder <token> in it: put the real token there.'
      : 'The token in this link is ' + token.length + ' characters' + (/[^A-Za-z0-9_]/.test(token) ? ' and contains characters a GitHub token never has' : '') +
        '. A fine-grained token starts with github_pat_ and is about 90 letters, digits and _ characters. Copy it again from GitHub, or make a new one.';
    history.replaceState(null, '', m[1] + '/token/');   // keep the bad token out of history
  })();
</script>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, sans-serif; background: #f4f5f3; color: #0b0b0b; }
  @media (prefers-color-scheme: dark) { body { background: #111110; color: #f0efec; } a { color: #8ab8f0; } }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1 id="title">Page not found</h1>
  <p id="why"></p>
  <p><a href="/SwimTracker/">Open SwimTracker</a></p>
</main>
<script>
  if (window.__tokenProblem) {
    document.getElementById('title').textContent = 'This share link did not work';
    document.getElementById('why').textContent = window.__tokenProblem;
  }
</script>
</body>
</html>
