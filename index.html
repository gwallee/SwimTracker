<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwimTracker</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="name">SwimTracker</h1>
    <div id="meta" class="muted"></div>
  </div>
  <div class="actions">
    <button id="importBtn" class="primary">Import</button>
    <button id="exportBtn">Export</button>
    <a class="btn" href="install.html">Pull button</a>
  </div>
</header>
<main id="main"></main>

<dialog id="importDlg">
  <form method="dialog" class="dlg">
    <h2>Import a pull</h2>
    <p class="muted">Pick the file the SwimTracker pull button saved, or paste what it copied. Importing again is safe: swims already here are skipped.</p>
    <input type="file" id="file" accept=".json,application/json" multiple>
    <textarea id="paste" placeholder="…or paste here"></textarea>
    <div id="importMsg" class="msg" role="status"></div>
    <div class="row">
      <button value="cancel" formnovalidate>Close</button>
      <button id="doImport" class="primary" value="default">Import</button>
    </div>
  </form>
</dialog>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
